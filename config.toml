# Настройки оптимизатора расписания ИМИ МПГУ.
# Всё необязательно: без этого файла используются значения по умолчанию.

max_pairs_per_day = 4

# Оптимизировать только эти группы (остальные остаются как есть, но учитываются при накладках)
# groups = ["ВOМ34-МКН2601", "ВOМ34-ПМЭ2604", "ВOМ34-ПМЭ2605"]

# Занятия этих преподавателей не двигать
# fixed_teachers = ["Атанасян С.Л."]

[weights]
conflict = 1000          # накладка преподавателя / группы / аудитории
room_unsuitable = 300    # лаба не в компьютерном классе, поток не влезает
teacher_unavailable = 500
group_gap = 12           # окно у группы
teacher_gap = 3          # окно у преподавателя
group_overload = 15      # больше max_pairs_per_day пар в день
group_single = 8        # приезжать ради одной пары
late_pair = 4            # пары после 16:00 у очников
saturday = 3             # суббота у очников
pe_travel = 40           # физкультура (Кибальчича, 16) вплотную к паре на Краснопрудной
teacher_new_day = 10     # новый рабочий день преподавателю
stability = 0            # перенос занятия (в режиме gentle — не меньше 25)
stream_bonus = 3         # поощрение за лекцию потоком (одна лекция сразу нескольким группам курса)
room_change = 0.5        # смена аудитории (в режиме gentle — не меньше 8)

# Пожелания преподавателей: дни/пары, когда они не могут.
# Формат: «пн», «сб», «ср 1-2» (пары с 1), «пт 5».
# [teachers."Цыбуля Л.М."]
# unavailable = ["сб", "пн 1"]
